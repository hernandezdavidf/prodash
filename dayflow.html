<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How's our Dave looking? · ProDash</title>
<!-- The app used to live at this filename, and index.html was the stub that
     redirected here - which is why the address bar always showed
     ".../prodash/dayflow.html". That is now inverted: index.html IS the app,
     so the URL is just ".../prodash/", and this file is the stub.

     It exists purely so nothing that already points here breaks:
       - bookmarks and any link shared before the swap
       - the installed PWA on a phone, whose manifest start_url is
         "./dayflow.html" (its manifest `id` is deliberately left at that same
         value, because changing an id makes the browser treat it as a
         different app and orphans the existing install)

     Same origin either way, so a redirect through here loses no session, no
     board cache and no file handle. Safe to delete only once you are sure no
     device is still launching from the old path. -->
<meta http-equiv="refresh" content="0; url=./">
<link rel="canonical" href="./">
<script>location.replace("./");</script>
</head>
<body>
<p>Redirecting to <a href="./">ProDash</a>…</p>
</body>
</html>
